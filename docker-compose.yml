services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  model:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    environment:
      MODEL_DIR: /models
    volumes:
      - ./models/deployed:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://triage:triage@postgres:5432/triage
      MODEL_SERVICE_URL: http://model:8000
      RESULTS_PATH: /results/model_results.json
      THRESHOLD_PATH: /results/threshold.json
      PORT: "3000"
    volumes:
      - ./training/results:/results:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
